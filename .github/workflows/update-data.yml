name: Update risk data

# Re-indexes the tracked Stacks protocols, recomputes scores and commits the new snapshot.
# Every push to main triggers a Vercel rebuild, so the public dashboard stays current without a backend.
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Index protocols and compute scores
        env:
          HIRO_API_KEY: ${{ secrets.HIRO_API_KEY }}
        run: npm run pipeline

      - name: Run scoring tests
        run: npm test

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data frontend/dashboard/src/data/snapshot.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: refresh risk snapshot ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
